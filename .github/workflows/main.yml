name: Pathecho CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  IMAGE_TAG: v1.0.0

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Vet
      run: go vet ./...

    - name: Test with coverage
      run: |
        set -euo pipefail

        go test -race -coverpkg=./... -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tee coverage-func.txt
        total=$(awk '/total:/{print $NF}' coverage-func.txt)

        echo
        echo "=== Coverage by package ==="
        python3 - <<'PY' | tee coverage-table.md
        from collections import defaultdict

        blocks = {}
        with open("coverage.out") as f:
            next(f)
            for line in f:
                line = line.strip()
                if not line:
                    continue
                loc, stmts, count = line.rsplit(" ", 2)
                file, span = loc.split(":", 1)
                key = (file, span)
                stmts, covered = int(stmts), 1 if int(count) > 0 else 0
                if key in blocks:
                    prev_stmts, prev_covered = blocks[key]
                    blocks[key] = (prev_stmts, prev_covered or covered)
                else:
                    blocks[key] = (stmts, covered)

        pkgs = defaultdict(lambda: [0, 0])
        for (file, _), (stmts, covered) in blocks.items():
            prefix = "github.com/pathecho/"
            if not file.startswith(prefix):
                continue
            rest = file[len(prefix):]
            pkg = "/".join(rest.split("/")[:-1]) or "."
            pkgs[pkg][0] += stmts
            pkgs[pkg][1] += stmts if covered else 0

        order = [
            "internal/httpapi",
            "internal/oauth",
            "internal/server",
            "internal/stub",
            "cmd/pathecho",
        ]
        print("| Package | Coverage |")
        print("| --- | --- |")
        for pkg in order:
            stmts, covered = pkgs.get(pkg, [0, 0])
            if stmts == 0:
                pct = "n/a"
            else:
                pct = f"{100.0 * covered / stmts:.1f}%"
            print(f"| `{pkg}` | {pct} |")

        total_stmts = sum(v[0] for v in pkgs.values())
        total_covered = sum(v[1] for v in pkgs.values())
        total = f"{100.0 * total_covered / total_stmts:.1f}%" if total_stmts else "n/a"
        print(f"| **Total** | **{total}** |")
        PY

        echo
        echo "=== Coverage total ==="
        echo "${total}"

        {
          echo "## Coverage"
          echo
          cat coverage-table.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage profile
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: coverage
        path: |
          coverage.out
          coverage-func.txt
          coverage-table.md
        if-no-files-found: ignore

  e2e:
    name: E2E
    needs: test
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build container image
      run: docker build -t pathecho-e2e:ci .

    - name: Run container e2e suite
      env:
        PATHECHO_E2E_IMAGE: pathecho-e2e:ci
        PATHECHO_E2E_SKIP_BUILD: "1"
      run: go test -tags=e2e ./e2e/ -count=1 -v

  dockerhub:
    name: Docker
    needs: [test, e2e]
    runs-on: ubuntu-22.04

    steps:
    - name: Show docker version
      run: docker version

    - name: Checkout sources
      uses: actions/checkout@v6

    - name: Build pathecho container image locally
      run: docker build -t email4tong/pathecho:${{ env.IMAGE_TAG }} .

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DH_USER }}
        password: ${{ secrets.DH_KEY }}

    - name: Build and push images
      run: |
        docker buildx build --push \
          --tag email4tong/pathecho:${{env.IMAGE_TAG}} \
          --platform linux/amd64,linux/arm64 .

    - name: Build and push images with latest tag
      run: |
        docker buildx build --push \
          --tag email4tong/pathecho:latest \
          --platform linux/amd64,linux/arm64 .
